apiVersion: v1
kind: Namespace
metadata:
  name: activemq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activemq-artemis
  namespace: activemq
  labels:
    app: activemq-artemis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activemq-artemis
  template:
    metadata:
      labels:
        app: activemq-artemis
    spec:
      containers:
      - name: artemis
        # official Apache image on Docker Hub
        image: apache/activemq-artemis:2.17.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: amqp
          containerPort: 5672
        - name: core
          containerPort: 61616
        - name: http
          containerPort: 8161
        env:
        - name: ARTEMIS_USERNAME
          value: "admin"
        - name: ARTEMIS_PASSWORD
          value: "admin"
        # keep it simple for dev — remove liveness/readiness if you want to iterate fast
        readinessProbe:
          tcpSocket:
            port: 61616
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: activemq-artemis
  namespace: activemq
spec:
  type: ClusterIP
  selector:
    app: activemq-artemis
  ports:
  - name: core
    port: 61616
    targetPort: 61616
  - name: http
    port: 8161
    targetPort: 8161
  - name: amqp
    port: 5672
    targetPort: 5672
