replicaCount: 1

image:
  tag: "1.24.0"   # example, adjust if needed

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

persistence:
  enabled: true
  size: 2Gi
  storageClass: ""   # set to your storageClass name or leave blank for default

service:
  type: LoadBalancer
  port: 8080
